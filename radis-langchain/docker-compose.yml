services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    restart: unless-stopped
    ports:
      - "6379:6379"   # Redis Server (Vector DB)
      - "8001:8001"   # RedisInsight Web GUI
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--save 60 1000 --appendonly yes

volumes:
  redis_data:
    driver: local
